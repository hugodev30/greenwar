<div id="srlive" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="saveWarning" class="save-warning" role="alert" hidden></div>
<div class="wrap">
  <header>
    <h1 id="hdrTitle">Crônicas da Separação</h1>
    <div>
      <button class="btn-sm" id="btnMenu" title="Escolher outro cenário">☰ Cenários</button>
      <button class="btn-sm" id="btnHelp" title="Como jogar">? Ajuda</button>
      <button class="btn-sm" id="btnRestart" title="Recomeçar do início">↺ Recomeçar</button>
      <button class="btn-sm" id="btnSet" title="Configurações: idioma, acessibilidade e som">⚙ <span class="bl">Configurações</span></button>
      <button class="btn-sm" id="btnSnd" aria-pressed="false" title="Som">🔊</button>
      <button class="btn-sm acct-btn" id="btnAcct" title="Conta, perfil e saves na nuvem" hidden>👤 Entrar</button>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <footer>Obra de ficção / história alternativa. Não representa fatos nem endosso. Progresso salvo automaticamente neste navegador, separado por cenário. Funciona offline e sem conta; com login, os saves e finais também vão para a nuvem.</footer>
</div>
